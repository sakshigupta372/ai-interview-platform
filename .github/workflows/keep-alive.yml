name: Keep backend awake

# Render's free tier sleeps after ~15 min without traffic. GitHub only runs
# schedules from the default branch, and may delay or skip runs under load.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://ai-interview-platform-1-h5tt.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 20 "$BACKEND_URL/healthz"
